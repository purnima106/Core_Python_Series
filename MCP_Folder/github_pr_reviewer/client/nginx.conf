server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # ── Proxy /api/* → FastAPI backend container ────────────────────────────
    # This is what prevents the browser from getting a 404 HTML page instead
    # of a JSON response when calling /api/review.
    # "backend" is the Docker Compose service name (internal DNS).
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ── Serve React SPA ─────────────────────────────────────────────────────
    # All other routes fall through to index.html so React Router can handle them.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
